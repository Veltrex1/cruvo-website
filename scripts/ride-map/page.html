<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>html,body{margin:0;padding:0;background:#fff}#map{position:absolute;inset:0}</style>
<script src="vendor/maplibre-gl.js"></script><script src="vendor/maplibre-contour.js"></script></head><body><div id="map"></div>
<script>
window.renderMap = (cfg) => new Promise((resolve) => {
  if (!cfg.contours) {
    cfg.style.layers = cfg.style.layers.filter((l) => l.id !== 'contours');
  } else {
  const dem = new mlcontour.DemSource({ url: cfg.demUrl, encoding: 'terrarium', maxzoom: 13, worker: false });
  dem.setupMaplibre(maplibregl);
  cfg.style.sources.contours = { type: 'vector', tiles: [dem.contourProtocolUrl({ multiplier: 3.28084, thresholds: { 11: [60, 300], 12: [50, 250], 13: [40, 200], 14: [20, 100] }, elevationKey: 'ele', levelKey: 'level', contourLayer: 'contours' })], maxzoom: 15 };
  }
  const opts = { container: 'map', style: cfg.style, interactive: false, attributionControl: false, preserveDrawingBuffer: true, fadeDuration: 0, pixelRatio: cfg.pixelRatio || 1, center: cfg.center, zoom: cfg.zoom };
  const map = new maplibregl.Map(opts);
  window.__map = map;
  map.on('error', (e) => { (window.__errors = window.__errors || []).push(String(e.error && e.error.message || e)); });
  let done = false;
  const finish = (how) => { if (done) return; done = true; resolve({ how, loaded: map.loaded(), zoom: map.getZoom(), center: map.getCenter().toArray() }); };
  map.once('idle', () => finish('idle'));
  setTimeout(() => finish('timeout'), cfg.timeoutMs || 90000);
});
window.exportImage = (type, quality) => window.__map.getCanvas().toDataURL(type, quality);
</script></body></html>
